<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 190" role="img" aria-labelledby="f2-title f2-desc">
  <title id="f2-title">De Bruijn indices</title>
  <desc id="f2-desc">In λx. λy. x y, the x refers to the outer λ and the y to the inner one. Replaced by the number of λs in between, the term becomes λ. λ. 1 0. The environment lists the arguments innermost first, so index 0 is the argument of λy and index 1 the argument of λx.</desc>
  <defs>
    <marker id="f2-head" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path class="fill-accent" d="M0,0 L8,4 L0,8 z"/>
    </marker>
    <marker id="f2-head-muted" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path class="fill-muted" d="M0,0 L8,4 L0,8 z"/>
    </marker>
  </defs>

  <!-- With names: arrows from each variable to its λ -->
  <text class="label" x="20" y="28">Names</text>
  <path class="line" d="M155,62 C155,44 106,44 106,60" marker-end="url(#f2-head)"/>
  <path class="line" d="M135,62 C135,30 66,30 66,60" marker-end="url(#f2-head)"/>
  <text class="code" x="50" y="82" textLength="30" lengthAdjust="spacingAndGlyphs">λx.</text>
  <text class="code" x="90" y="82" textLength="30" lengthAdjust="spacingAndGlyphs">λy.</text>
  <text class="code" x="130" y="82" textLength="10">x</text>
  <text class="code" x="150" y="82" textLength="10">y</text>

  <!-- Without names -->
  <text class="label" x="20" y="128">Indices</text>
  <text class="code" x="50" y="170" textLength="20" lengthAdjust="spacingAndGlyphs">λ.</text>
  <text class="code" x="90" y="170" textLength="20" lengthAdjust="spacingAndGlyphs">λ.</text>
  <text class="code" x="130" y="170" textLength="10">1</text>
  <text class="code" x="150" y="170" textLength="10">0</text>

  <!-- The environment inside the body, innermost first -->
  <text x="300" y="56">A variable becomes the number of λs between it</text>
  <text x="300" y="76">and its own λ. Variable n is then the n-th entry</text>
  <text x="300" y="96">of the environment, counting from the innermost λ.</text>
  <text class="label" x="300" y="128">Environment in the body</text>
  <rect class="box" x="300" y="146" width="160" height="34" rx="6"/>
  <text class="code" x="312" y="169" textLength="10">0</text>
  <text x="334" y="168">argument of λy</text>
  <path class="line-muted" d="M462,163 H490" marker-end="url(#f2-head-muted)"/>
  <rect class="box" x="494" y="146" width="160" height="34" rx="6"/>
  <text class="code" x="506" y="169" textLength="10">1</text>
  <text x="528" y="168">argument of λx</text>
</svg>
