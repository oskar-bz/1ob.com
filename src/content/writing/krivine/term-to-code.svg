<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 350" role="img" aria-labelledby="f4-title f4-desc">
  <title id="f4-title">A term and its code</title>
  <desc id="f4-desc">The term (λx y. x y) S Z as a tree, each node numbered with the address of its instruction, next to the compiled code: 0 PUSH 8, 1 PUSH 7, 2 GRAB, 3 GRAB, 4 PUSH 6, 5 ACCESS 1, 6 ACCESS 0, 7 FREE S, 8 FREE Z. A function or body always follows its node directly; each PUSH points ahead to its argument's code.</desc>
  <defs>
    <marker id="f4-head" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path class="fill-accent" d="M0,0 L8,4 L0,8 z"/>
    </marker>
  </defs>

  <!-- Tree edges: solid = the child comes next in memory, dashed = an argument stored elsewhere -->
  <line class="line" x1="160" y1="40" x2="100" y2="100"/>
  <line class="line-faint dash" x1="160" y1="40" x2="230" y2="100"/>
  <line class="line" x1="100" y1="100" x2="60" y2="160"/>
  <line class="line-faint dash" x1="100" y1="100" x2="150" y2="160"/>
  <line class="line" x1="60" y1="160" x2="60" y2="215"/>
  <line class="line" x1="60" y1="215" x2="60" y2="270"/>
  <line class="line" x1="60" y1="270" x2="30" y2="325"/>
  <line class="line-faint dash" x1="60" y1="270" x2="100" y2="325"/>

  <!-- Tree nodes, with their addresses -->
  <g text-anchor="middle">
    <circle class="box" cx="160" cy="40" r="16"/><text class="code" x="160" y="45">@</text>
    <circle class="box" cx="100" cy="100" r="16"/><text class="code" x="100" y="105">@</text>
    <circle class="box" cx="230" cy="100" r="16"/><text class="code" x="230" y="105">Z</text>
    <circle class="box" cx="60" cy="160" r="16"/><text class="code" x="60" y="165">λx</text>
    <circle class="box" cx="150" cy="160" r="16"/><text class="code" x="150" y="165">S</text>
    <circle class="box" cx="60" cy="215" r="16"/><text class="code" x="60" y="220">λy</text>
    <circle class="box" cx="60" cy="270" r="16"/><text class="code" x="60" y="275">@</text>
    <circle class="box" cx="30" cy="325" r="16"/><text class="code" x="30" y="330">x</text>
    <circle class="box" cx="100" cy="325" r="16"/><text class="code" x="100" y="330">y</text>
  </g>
  <text class="address" x="181" y="33">0</text>
  <text class="address" x="121" y="93">1</text>
  <text class="address" x="251" y="93">8</text>
  <text class="address" x="81" y="153">2</text>
  <text class="address" x="171" y="153">7</text>
  <text class="address" x="81" y="208">3</text>
  <text class="address" x="81" y="263">4</text>
  <text class="address" x="51" y="318">5</text>
  <text class="address" x="121" y="318">6</text>

  <!-- The code -->
  <text class="address" x="370" y="50">0</text><text class="code" x="400" y="50">PUSH 8</text>
  <text class="address" x="370" y="82">1</text><text class="code" x="400" y="82">PUSH 7</text>
  <text class="address" x="370" y="114">2</text><text class="code" x="400" y="114">GRAB</text>
  <text class="address" x="370" y="146">3</text><text class="code" x="400" y="146">GRAB</text>
  <text class="address" x="370" y="178">4</text><text class="code" x="400" y="178">PUSH 6</text>
  <text class="address" x="370" y="210">5</text><text class="code" x="400" y="210">ACCESS 1</text>
  <text class="address" x="370" y="242">6</text><text class="code" x="400" y="242">ACCESS 0</text>
  <text class="address" x="370" y="274">7</text><text class="code" x="400" y="274">FREE S</text>
  <text class="address" x="370" y="306">8</text><text class="code" x="400" y="306">FREE Z</text>
  <path class="line" d="M478,45 C640,45 640,301 498,301" marker-end="url(#f4-head)"/>
  <path class="line" d="M478,77 C600,77 600,269 488,269" marker-end="url(#f4-head)"/>
  <path class="line" d="M478,173 C540,173 540,237 508,237" marker-end="url(#f4-head)"/>
</svg>
